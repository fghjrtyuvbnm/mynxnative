name: Update external data launchers
on:
  workflow_dispatch:
    inputs:
      target:
        description: Launcher group to rebuild
        type: choice
        options: [existing, botw, botw-tablet, botw-190, xenoblade2]
        default: existing
permissions:
  contents: read
jobs:
  launcher:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(startsWith(inputs.target, 'botw') && '["botw"]' || inputs.target == 'xenoblade2' && '["xenoblade2"]' || '["unicorn", "octopath-ii", "three-houses"]') }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seedds/nxnative
          ref: cde88f62068e3d879b083b1a86a7fd78610c7b7b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-config
          persist-credentials: false
      - name: Test import, offline launch and clear
        run: |
          dir=build-config/scripts/resonance_cache
          xcrun swiftc "$dir/GameDataCore.swift" "$dir/ShaderCache.swift" "$dir/ShaderCacheTests.swift" -o "$RUNNER_TEMP/data-tests"
          "$RUNNER_TEMP/data-tests"
      - name: Check large image hash memory use
        if: matrix.game == 'botw'
        run: |
          image="$RUNNER_TEMP/large-image.img"
          mkfile -n 1024m "$image"
          expected=$(shasum -a 256 "$image" | cut -d ' ' -f 1)
          "$RUNNER_TEMP/data-tests" "$image" "$expected"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Check tablet touch geometry
        if: inputs.target == 'botw-tablet' || inputs.target == 'botw-190' || matrix.game == 'xenoblade2'
        working-directory: build-config
        run: python -m unittest scripts.tests.test_touch_layout scripts.tests.test_botw_action_pad
      - name: Test physical controller mapping
        if: inputs.target == 'botw-190' || matrix.game == 'xenoblade2'
        working-directory: build-config
        run: |
          xcrun clang -std=c11 -Wall -Werror dm/host/tests/t_pad_face.c -o "$RUNNER_TEMP/pad-face"
          "$RUNNER_TEMP/pad-face"
      - name: Install build tools
        run: |
          brew install xcodegen
          python -m pip install lz4 fonttools cryptography
      - name: Install iOS Metal compiler
        if: matrix.game == 'botw' || matrix.game == 'xenoblade2'
        run: |
          if ! xcrun -sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk iphoneos metal --version
      - name: Restore authenticated build inputs
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
          GAME_INPUT: ${{ inputs.target == 'botw-190' && 'botw-190' || matrix.game }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, sys
          sys.path.insert(0, 'build-config/scripts')
          from ipa_crypto import transform
          temp = Path(os.environ['RUNNER_TEMP'])
          game = os.environ['GAME_INPUT']
          key = bytes.fromhex(os.environ['BUILD_CIPHER_KEY'])
          for index, directory in enumerate(('build-input-' + game, 'launcher-upgrade/' + game)):
              parts = sorted((Path('build-config') / directory).rglob('part-*'))
              if not parts:
                  raise ValueError('Missing ' + directory)
              encrypted = temp / f'input{index}.enc'
              with encrypted.open('wb') as stream:
                  for part in parts:
                      stream.write(part.read_bytes())
              transform(encrypted, temp / f'input{index}.tar', key, True)
          PY
      - name: Apply iOS GPU work directory cleanup
        if: inputs.target == 'botw-190'
        run: git apply --check build-config/.github/botw-gpuarchiver.patch && git apply build-config/.github/botw-gpuarchiver.patch
      - name: Compile launcher with existing shader identity
        env:
          BOTW_TABLET_PAD: ${{ inputs.target == 'botw-tablet' && '1' || '0' }}
        run: |
          python -u build-config/scripts/resonance_cache/upgrade_launcher.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/input0.tar" "$RUNNER_TEMP/input1.tar" "$RUNNER_TEMP/game" "$RUNNER_TEMP/launcher.ipa"
      - name: Verify compiled iOS host libraries
        if: matrix.game == 'botw' || matrix.game == 'xenoblade2'
        run: |
          header=dm/host/gen/msl-iphoneos/host_msl_gen.h
          for library in deswz present; do
            grep -Eq "k_host_msl_lib_${library}, [1-9][0-9]*}" "$header"
          done
      - name: Verify compiled GPU cleanup and Action layout
        if: inputs.target == 'botw-190'
        run: |
          python - <<'PY'
          import os, plistlib, zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'launcher.ipa') as ipa:
              root = 'Payload/DmIOS.app/'
              info = plistlib.loads(ipa.read(root + 'Info.plist'))
              assert info['CFBundleIdentifier'] == 'org.nxnative.01007ef00011e000.v190'
              assert info['DMTabletPad'] is True and info['DTSDKName'] == 'iphoneos27.2'
              exe = ipa.read(root + info['CFBundleExecutable'])
              assert b'old Metal work directories from the game cache' in exe
              assert b'DmBotwPadLayout\0' in exe
          PY
      - name: Encrypt updated IPA
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: python build-config/scripts/ipa_crypto.py encrypt "$RUNNER_TEMP/launcher.ipa" "$RUNNER_TEMP/launcher.enc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-upgrade-${{ matrix.game }}
          path: ${{ runner.temp }}/launcher.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
