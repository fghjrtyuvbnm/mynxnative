name: Build MeloNX 2.7 iOS IPA
on:
  push:
    branches:
      - 'codex/melonx-2.7-*'

permissions:
  contents: read

env:
  MELO_COMMIT: 13700519f3abc4e6d7ed8a065b118b2cc59bcd67
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify and unpack the official source snapshot
        shell: bash
        run: |
          echo "83fe24daa81880a7e6b43506f5df3195e509f25834531b2ac0f6721b0e254871  MeloNX-13700519.tar.gz" | shasum -a 256 --check
          mkdir melonx
          tar -xzf MeloNX-13700519.tar.gz -C melonx --strip-components=1
          test -f melonx/global.json
          test -f melonx/src/MeloNX/MeloNX.xcodeproj/project.pbxproj

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: melonx/global.json

      - name: Configure the iOS build tools
        shell: bash
        run: |
          sudo ln -sf "$(command -v dotnet)" /usr/local/bin/dotnet
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          dotnet --info

      - name: Archive unsigned app for physical iPads
        shell: bash
        working-directory: melonx
        run: |
          xcodebuild archive \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MeloNX.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=

      - name: Verify and package
        shell: bash
        run: |
          mkdir -p package/Payload
          ditto "$RUNNER_TEMP/MeloNX.xcarchive/Products/Applications/MeloNX.app" package/Payload/MeloNX.app
          cd package
          python3 - <<'PY'
          import plistlib
          import subprocess
          from pathlib import Path

          app = Path('Payload/MeloNX.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleShortVersionString'] in {'2.7', '2.7.0'}, info
          assert 2 in info['UIDeviceFamily'], info
          minimum = tuple(map(int, info['MinimumOSVersion'].split('.')))
          assert minimum <= (27, 2, 0), info
          exe = app / info['CFBundleExecutable']
          subprocess.run(['xcrun', 'lipo', '-verify_arch', 'arm64', str(exe)], check=True)
          subprocess.run(['xcrun', 'vtool', '-show-build', str(exe)], check=True)
          for key in ('CFBundleIdentifier', 'CFBundleShortVersionString', 'CFBundleVersion', 'MinimumOSVersion', 'UIDeviceFamily'):
              print(f'{key}: {info[key]}')
          print('App extensions:', sorted(str(p) for p in app.glob('PlugIns/*.appex')))
          PY
          zip -qry MeloNX-2.7-source-unsigned.ipa Payload
          unzip -tq MeloNX-2.7-source-unsigned.ipa
          shasum -a 256 MeloNX-2.7-source-unsigned.ipa > MeloNX-2.7-source-unsigned.sha256
          printf '%s\n' "$MELO_COMMIT" > SOURCE_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MeloNX-2.7-source-unsigned
          path: |
            package/MeloNX-2.7-source-unsigned.ipa
            package/MeloNX-2.7-source-unsigned.sha256
            package/SOURCE_COMMIT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
