name: Build FFR local shader cache IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resonance-cache-ipa
  cancel-in-progress: false
jobs:
  launcher:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seedds/nxnative
          ref: cdc6cef6b0250fcb54a061e4c55d56382b5d18ad
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Test shader cache recovery and reuse
        run: |
          set -euo pipefail
          dir=build-config/scripts/resonance_cache
          xcrun swiftc "$dir/GameDataCore.swift" "$dir/ShaderCache.swift" "$dir/ShaderCacheTests.swift" -o "$RUNNER_TEMP/shader-cache-tests"
          "$RUNNER_TEMP/shader-cache-tests"
      - name: Install build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install xcodegen zstd
          python -m pip install lz4 capstone fonttools cryptography
      - name: Restore authenticated linking inputs
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          temp=Path(os.environ['RUNNER_TEMP'])
          path=temp/'launcher-input.enc'
          parts=sorted(Path('build-config/build-input-resonance-cache-tail').glob('part-*'))
          assert parts, 'Missing encrypted linking inputs'
          with path.open('wb') as stream:
              for part in parts: stream.write(part.read_bytes())
          transform(path,temp/'launcher-input.tar.xz',bytes.fromhex(os.environ['BUILD_CIPHER_KEY']),True)
          PY
      - name: Apply iOS GPU work directory cleanup
        run: git apply --check build-config/.github/gpuarchiver-cleanup-ffr.patch && git apply build-config/.github/gpuarchiver-cleanup-ffr.patch
      - name: Compile and validate launcher
        run: |
          set -euo pipefail
          python -u build-config/scripts/resonance_cache/build_cache_launcher.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/game" "$RUNNER_TEMP/launcher-input.tar.xz" "$RUNNER_TEMP/FFR-cache.ipa"
      - name: Encrypt unsigned IPA
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: python build-config/scripts/ipa_crypto.py encrypt "$RUNNER_TEMP/FFR-cache.ipa" "$RUNNER_TEMP/FFR-cache.ipa.enc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FFR-cache-encrypted-ipa
          path: ${{ runner.temp }}/FFR-cache.ipa.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
