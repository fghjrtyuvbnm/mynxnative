name: Build ZeldaBreathOfTheWild external-data IPA
on:
  workflow_dispatch:
    inputs:
      input_digest:
        description: SHA-256 of the encrypted 1.9.0 input (empty uses the original 1.6.0 input)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: botw-upstream-native-preflight
  cancel-in-progress: false
jobs:
  launcher:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BOTW_COMPILE_PREFLIGHT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seedds/nxnative
          ref: a0cad7e06a0821c52477ff20dbc53d6126748c54
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Test shader cache recovery and reuse
        run: |
          set -euo pipefail
          dir=build-config/scripts/resonance_cache
          xcrun swiftc "$dir/GameDataCore.swift" "$dir/ShaderCache.swift" "$dir/ShaderCacheTests.swift" -o "$RUNNER_TEMP/shader-cache-tests"
          "$RUNNER_TEMP/shader-cache-tests"
      - name: Apply the iOS layout and external-data port
        run: cp -R build-config/botw-upstream-overlay/. .
      - name: Test iPad touch layout
        run: |
          mkdir -p scripts/tests
          cp build-config/scripts/tests/test_touch_layout.py build-config/scripts/tests/test_botw_action_pad.py scripts/tests/
          python -m unittest scripts.tests.test_touch_layout scripts.tests.test_botw_action_pad
      - name: Install build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install xcodegen zstd glslang
          if ! xcrun -sdk iphoneos metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          python -m pip install lz4 "capstone>=5,<6" fonttools cryptography requests nsz zbic
      - name: Restore authenticated linking inputs
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
          INPUT_DIGEST: ${{ inputs.input_digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re, sys
          from pathlib import Path
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          temp=Path(os.environ['RUNNER_TEMP'])
          path=temp/'launcher-input.enc'
          digest=os.environ['INPUT_DIGEST']
          if digest:
              assert re.fullmatch('[0-9a-f]{64}', digest)
              parts=sorted(Path('build-config/build-input-botw-190-upstream').rglob('part-*'))
              assert parts, 'Missing encrypted 1.9.0 linking inputs'
              with path.open('wb') as stream:
                  for part in parts: stream.write(part.read_bytes())
              with path.open('rb') as stream:
                  assert hashlib.file_digest(stream,'sha256').hexdigest()==digest, 'Encrypted input digest mismatch'
          else:
              parts=sorted(Path('build-config/build-input-botw').rglob('part-*'))
              assert parts, 'Missing encrypted linking inputs'
              with path.open('wb') as stream:
                  for part in parts: stream.write(part.read_bytes())
          transform(path,temp/'launcher-input.tar.xz',bytes.fromhex(os.environ['BUILD_CIPHER_KEY']),True)
          old=temp/'original-shader-input.enc'
          source=Path('build-config/build-input-botw-190-upstream-shaders')
          old_parts=sorted(source.rglob('part-*'))
          if not old_parts:
              raise ValueError('Missing authenticated shader source archive')
          with old.open('wb') as stream:
              for part in old_parts:
                  stream.write(part.read_bytes())
          transform(old,temp/'original-shader-input.tar.xz',bytes.fromhex(os.environ['BUILD_CIPHER_KEY']),True)
          PY
      - name: Compile external launcher
        run: |
          set -euo pipefail
          python -u build-config/scripts/resonance_cache/build_botw_upstream.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/launcher-input.tar.xz" "$RUNNER_TEMP/original-shader-input.tar.xz" "$RUNNER_TEMP/game" "$RUNNER_TEMP/output"
      - name: Report build diagnostics
        if: failure()
        run: |
          for name in mac_host_make mac_host_build heap_check dmsh_build; do
            path="$RUNNER_TEMP/game/logs/$name.log"
            if [ -f "$path" ]; then tail -40 "$path"; fi
          done
      - name: Encrypt build diagnostics
        if: always()
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: |
          python - <<'PY'
          import os, tarfile, sys
          from pathlib import Path
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          temp=Path(os.environ['RUNNER_TEMP']); work=temp/'game'
          with tarfile.open(temp/'botw-diagnostics.tar','w') as tar:
              for name in ('logs','profile'):
                  path=work/name
                  if path.exists(): tar.add(path,name)
          transform(temp/'botw-diagnostics.tar',temp/'botw-diagnostics.enc',bytes.fromhex(os.environ['BUILD_CIPHER_KEY']))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ZeldaBreathOfTheWild-encrypted-diagnostics
          path: ${{ runner.temp }}/botw-diagnostics.enc
          retention-days: 1
          compression-level: 0
