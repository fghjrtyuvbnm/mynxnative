name: Build RPG external IPA
on:
  workflow_dispatch:
    inputs:
      input_digest:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seedds/nxnative
          ref: c379a903f47dd6d8cbdc4b2b36e67e7bb8ebc250
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Install build tools and external-data overlay
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cp -R build-config/rpg-overlay/. .
          brew install xcodegen zstd glslang
          if ! xcrun -sdk iphoneos metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          python -m pip install lz4 "capstone>=5,<6" fonttools cryptography requests
      - name: Restore authenticated build inputs
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
          INPUT_DIGEST: ${{ inputs.input_digest }}
        run: |
          python - <<'PY'
          import hashlib, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          temp=Path(os.environ['RUNNER_TEMP'])
          cipher=temp/'input.enc'
          with cipher.open('wb') as dst:
              for p in sorted(Path('build-config/rpg-input').glob('part-*')):
                  with p.open('rb') as src: shutil.copyfileobj(src,dst)
          with cipher.open('rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()==os.environ['INPUT_DIGEST']
          transform(cipher,temp/'input.tar.xz',bytes.fromhex(os.environ['BUILD_CIPHER_KEY']),True)
          PY
      - name: Compile shaders and unsigned IPA
        run: python -u build-config/scripts/resonance_cache/rpg_cloud_build.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/input.tar.xz" "$RUNNER_TEMP/game" "$RUNNER_TEMP/output"
      - name: Encrypt diagnostics
        if: always()
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: |
          python - <<'PY'
          import os, sys, tarfile
          from pathlib import Path
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          t=Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(t/'diagnostics.tar','w') as tar:
              for n in ('logs','profile'):
                  p=t/'game'/n
                  if p.exists(): tar.add(p,n)
          transform(t/'diagnostics.tar',t/'diagnostics.enc',bytes.fromhex(os.environ['BUILD_CIPHER_KEY']))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rpg-encrypted-diagnostics
          path: ${{ runner.temp }}/diagnostics.enc
          retention-days: 2
          compression-level: 0
      - name: Encrypt output
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: |
          tar -cf "$RUNNER_TEMP/output.tar" -C "$RUNNER_TEMP/output" game.ipa shaders.pack game-data.json
          python build-config/scripts/ipa_crypto.py encrypt "$RUNNER_TEMP/output.tar" "$RUNNER_TEMP/output.enc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rpg-encrypted-build
          path: ${{ runner.temp }}/output.enc
          retention-days: 2
          compression-level: 0
