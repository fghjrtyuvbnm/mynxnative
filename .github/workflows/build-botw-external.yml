name: Build DiscoElysiumTheFinalCut external-data IPA
on:
  workflow_dispatch:
    inputs:
      input_digest:
        description: SHA-256 of the encrypted Disco Elysium build input
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: disco-external-ipa
  cancel-in-progress: false
jobs:
  launcher:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seedds/nxnative
          ref: e6a358f5c1311c5a320e749a7ce3ddfd60ae1c7b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Apply iOS external-data support
        run: cp -R build-config/disco-overlay/. .
      - name: Install build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install xcodegen zstd glslang
          if ! xcrun -sdk iphoneos metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          python -m pip install lz4 "capstone>=5,<6" fonttools cryptography requests nsz zbic
      - name: Restore authenticated linking inputs
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
          INPUT_DIGEST: ${{ inputs.input_digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re, sys
          from pathlib import Path
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          temp=Path(os.environ['RUNNER_TEMP'])
          path=temp/'launcher-input.enc'
          digest=os.environ['INPUT_DIGEST']
          assert re.fullmatch('[0-9a-f]{64}', digest)
          parts=sorted(Path('build-config/build-input-disco-1013').glob('part-*'))
          assert parts, 'Missing encrypted linking inputs'
          with path.open('wb') as stream:
              for part in parts: stream.write(part.read_bytes())
          with path.open('rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()==digest, 'Encrypted input digest mismatch'
          transform(path,temp/'launcher-input.tar.xz',bytes.fromhex(os.environ['BUILD_CIPHER_KEY']),True)
          PY
      - name: Compile external launcher
        run: |
          set -euo pipefail
          python -u build-config/scripts/resonance_cache/build_disco.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/launcher-input.tar.xz" "$RUNNER_TEMP/game" "$RUNNER_TEMP/output"
      - name: Report build diagnostics
        if: failure()
        run: |
          for name in mac_host_make mac_host_build heap_check dmsh_build; do
            path="$RUNNER_TEMP/game/logs/$name.log"
            if [ -f "$path" ]; then tail -40 "$path"; fi
          done
      - name: Encrypt build diagnostics
        if: always()
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: |
          python - <<'PY'
          import os, tarfile, sys
          from pathlib import Path
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          temp=Path(os.environ['RUNNER_TEMP']); work=temp/'game'
          with tarfile.open(temp/'disco-diagnostics.tar','w') as tar:
              for name in ('logs','profile'):
                  path=work/name
                  if path.exists(): tar.add(path,name)
          transform(temp/'disco-diagnostics.tar',temp/'disco-diagnostics.enc',bytes.fromhex(os.environ['BUILD_CIPHER_KEY']))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: DiscoElysiumTheFinalCut-encrypted-diagnostics
          path: ${{ runner.temp }}/disco-diagnostics.enc
          retention-days: 1
          compression-level: 0
      - name: Encrypt unsigned IPA and shader pack
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: |
          set -euo pipefail
          tar -cf "$RUNNER_TEMP/disco.tar" -C "$RUNNER_TEMP/output" DiscoElysiumTheFinalCut.ipa game-data.json shaders.pack
          python build-config/scripts/ipa_crypto.py encrypt "$RUNNER_TEMP/disco.tar" "$RUNNER_TEMP/disco.enc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: DiscoElysiumTheFinalCut-encrypted-external-build
          path: ${{ runner.temp }}/disco.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

