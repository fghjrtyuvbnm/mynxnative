name: Upgrade six external-data games
on:
  workflow_dispatch:
    inputs:
      game:
        type: choice
        required: true
        options: [sentinels, unicorn, botw, octopath, three-houses, triangle]
permissions:
  contents: read
concurrency:
  group: upgrade-20261123-${{ inputs.game }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUILD_GAME: ${{ inputs.game }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seedds/nxnative
          ref: 5fc927d5ed2d4ba0c950a69bf27578ddd5714945
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-config
          persist-credentials: false
          sparse-checkout: |
            batch-20261123/build.py
            batch-20261123/normalize.py
            batch-20261123/remap.py
            batch-20261123/inputs.json
            batch-20261123/ShaderCacheTests.swift
            batch-20261123/overlay/
            batch-20261123/tests/
            batch-20261123/inputs/${{ inputs.game }}/
            scripts/ipa_crypto.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Apply retained layouts and external-data integration
        run: cp -R build-config/batch-20261123/overlay/. .
      - name: Verify layout and data-management behavior
        run: |
          set -euo pipefail
          mkdir -p scripts/tests
          cp build-config/batch-20261123/tests/test_*.py scripts/tests/
          python -m unittest discover -s scripts/tests -p test_touch_layout.py
          python -m unittest discover -s scripts/tests -p test_botw_action_pad.py
          dir=dm/ios/Sources
          xcrun swiftc "$dir/GameDataCore.swift" "$dir/ShaderCache.swift" build-config/batch-20261123/ShaderCacheTests.swift -o "$RUNNER_TEMP/data-tests"
          "$RUNNER_TEMP/data-tests"
      - name: Install native build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install xcodegen zstd glslang
          if ! xcrun -sdk iphoneos metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          python -m pip install lz4 "capstone>=5,<6" fonttools cryptography requests nsz zbic
      - name: Restore authenticated game inputs
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,sys,json,hashlib,shutil
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          root=Path('build-config/batch-20261123');game=os.environ['BUILD_GAME']
          info=json.loads((root/'inputs.json').read_text())[game]
          legacy=Path(os.environ['RUNNER_TEMP'])/'legacy';legacy.mkdir()
          wanted=dict(info['slots'],meta=info['metadata'])
          for name,digest in wanted.items():
              dest=legacy/(name+'.enc')
              with dest.open('wb') as out:
                  for p in sorted((root/'inputs'/game/name).rglob('part-*')):
                      with p.open('rb') as src:shutil.copyfileobj(src,out)
              with dest.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==digest
              transform(dest,dest.with_suffix('.tar.xz'),bytes.fromhex(os.environ['BUILD_CIPHER_KEY']),True)
          PY
          python build-config/batch-20261123/normalize.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/legacy" "$RUNNER_TEMP/normalized" "$RUNNER_TEMP/input.tar.xz"
      - name: Compile complete shaders and native runtime
        run: python -u build-config/batch-20261123/build.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/input.tar.xz" "$RUNNER_TEMP/game" "$RUNNER_TEMP/output"
      - name: Report build failures
        if: failure()
        run: |
          for file in "$RUNNER_TEMP/game/logs/"*.log; do
            if [ -f "$file" ]; then tail -35 "$file"; fi
          done
      - name: Encrypt outputs and recoverable checkpoints
        if: always()
        env:
          BUILD_CIPHER_KEY: ${{ secrets.BUILD_CIPHER_KEY }}
        run: |
          python - <<'PY'
          import os,sys,tarfile
          from pathlib import Path
          sys.path.insert(0,'build-config/scripts')
          from ipa_crypto import transform
          temp=Path(os.environ['RUNNER_TEMP']);out=temp/'output';sealed=temp/'sealed';sealed.mkdir(exist_ok=True)
          key=bytes.fromhex(os.environ['BUILD_CIPHER_KEY'])
          for name in ('game.ipa','game-data.json','shaders.pack'):
              source=out/name
              if source.is_file():
                  dest=sealed/(name+'.enc');transform(source,dest,key)
                  assert dest.stat().st_size==source.stat().st_size+36;source.unlink()
          with tarfile.open(temp/'diagnostics.tar','w') as tar:
              for name in ('logs','profile'):
                  source=temp/'game'/name
                  if source.exists():tar.add(source,name)
          transform(temp/'diagnostics.tar',sealed/'diagnostics.enc',key)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: upgrade-${{ inputs.game }}-encrypted
          path: ${{ runner.temp }}/sealed/*.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
